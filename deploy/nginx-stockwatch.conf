# nginx site for stockwatch.cloud. Installed once by hand (see deploy/README.md);
# certbot then adds the TLS listeners and the HTTP -> HTTPS redirect in place.
server {
    listen 80;
    listen [::]:80;
    server_name stockwatch.cloud www.stockwatch.cloud;

    # One origin: auth cookies and Better Auth's origin checks are for stockwatch.cloud only.
    if ($host = www.stockwatch.cloud) {
        return 301 https://stockwatch.cloud$request_uri;
    }

    # The built Vue client, served directly. Deploys swap the `current` symlink.
    root /var/www/stockwatch.cloud/current/client/dist;
    index index.html;

    # Locations below set caching with `expires`, not add_header, so they inherit these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Full-universe scans can take a while on a cold cache.
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change, so they can be cached forever.
    location /assets/ {
        expires max;
    }

    # SPA routing: unknown paths get index.html, which must never be cached.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
