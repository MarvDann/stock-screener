name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockwatch
          POSTGRES_PASSWORD: stockwatch
          POSTGRES_DB: stockwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://stockwatch:stockwatch@localhost:5432/stockwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir client install --frozen-lockfile
      - name: Server tests
        run: pnpm test
      - name: Client tests
        run: pnpm --dir client test
      - name: Build
        run: pnpm run build && pnpm --dir client run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stockwatch.cloud
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys: the deploy fails rather than talk to an impostor server.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "stockwatch@$VPS_HOST" \
            "bash -s -- ${{ github.sha }}" < deploy/deploy.sh
      - name: Check the live site
        run: curl -fsS -o /dev/null https://stockwatch.cloud/ && curl -fsS https://stockwatch.cloud/api/auth-providers
