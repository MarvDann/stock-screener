# Local Postgres for development and tests: `docker compose up -d`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stockwatch
      POSTGRES_PASSWORD: stockwatch
      POSTGRES_DB: stockwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
